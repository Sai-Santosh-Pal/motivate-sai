<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motivate Sai To Stop Procastinating</title>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <div class="bg bg-radial absolute blur from-[#fff6] to-black h-screen w-screen overflow-hidden">

    </div>
    <div class="h-screen flex items-center  justify-center w-screen bg-black">
        <div
            class="bigBox flex flex-col onTop border-1 bg-[#000a] h-[80%] w-[90%] max-w-200 rounded-xl border-1 border-gray-700">
            <div class="textarea mt-15 text-white flex text-center flex-col">
                <p class="title font-bold text-4xl">Motivate Sai!</p>
                <p class="subtitle text-gray-700 mb-20">click on this clicker to ping sai and make him code!</p>
            </div>
            <div class="self-center progress-bar w-[80%] h-4 rounded-xl bg-gray-700">
                <div id="progress" class="progress w-[0%] h-[100%] bg-white rounded-xl"></div>
            </div>
            <div class="text self-center text-center flex gap-2 flex-row gap-2 mt-5 text-white">
                <p id="progtext" class="target">30/180 hours done</p>
                <p class="gap">•</p>
                <p class="time">90 days left</p>
            </div>
            <div class="clicker self-center mt-40">
                <div id="shadow4" class="w-clicker mb-[-150px] rounded-[80px] w-50 h-50 bg-stone-500">
                    <div id="shadow3" class="w-clicker mb-[-150px] absolute rounded-[80px] w-50 h-50 bg-stone-600 self-center">
                        <div id="shadow2" class="w-clicker mb-[-150px] absolute rounded-[80px] w-50 h-50 bg-stone-700 self-center">
                            <div id="shadow1"
                                class="w-clicker mb-[-150px] absolute rounded-[80px] w-50 h-50 bg-stone-800 self-center">
                                <button id="clicker"
                                    class="cursor-pointer w-clicker mb-[-150px] font-bold text-2xl text-center flex items-center justify-center absolute rounded-[80px] w-50 h-50 bg-white self-center">
                                    Remind Sai!
                        </button>
                            </div>
                        </div>
                    </div>
                </div>
                
            </div>
            <div class="count text-white text-center mt-50 ">
                <p id="count">so far this button has been clicked 0 times</p>
            </div>
            
            
                    <script src="index.js"></script>
</body>
<style>
    * {
        font-family: 'Geist Pixel';
        transition: 0.2s;
    }

    .progress {
        transition: 0.5s ease-in-out !important
    }

    .onTop {
        z-index: 99;
    }
</style>

</html>
